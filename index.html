#learnLayout{scroll-margin-top:82px}

.online-heading{display:flex;justify-content:space-between;gap:15px;align-items:center}
.online-title{font:700 clamp(30px,4.2vw,43px) Georgia,serif;margin:10px 0 4px;word-break:break-word}
.online-phonetic{color:#9c7560;margin:0 0 9px;font-size:17px}

.online-meaning p{margin:8px 0}

.online-links{display:flex;gap:18px;flex-wrap:wrap;margin-top:20px}
.online-links a,.online-result a{color:#ad6745;text-decoration:none;font-weight:650}
.suggestion-heading{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;color:#9a7661;font-size:12px}
.suggestion-heading button{border:0;background:transparent;color:#9a7661;text-decoration:underline}
.suggestion-online{border-top:1px solid #f1e2d7;border-radius:0;margin-top:4px}
@media(max-width:730px){
 .hero{padding:18px 16px 25px;margin-top:10px;border-radius:18px}
 .hero h1{font-size:23px;margin:4px 0 4px}

 .hero-deco{display:none}
 .hero-foot{display:none}
 .hero .eyebrow{font-size:9px}
 .popular{font-size:11px;margin-top:9px}

}

.quiz-type-controls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:14px 0 16px}

.quiz-text-result{padding:16px;background:#f4faf4;border:1px solid #b5d7b8;border-radius:12px;margin-top:15px}

.quiz-text-result p{color:#8a7565}

/* V1.2 full dictionary and root provenance */
.learn-layout.dictionary-mode{display:block;max-width:880px;margin-inline:auto}
.learn-layout.dictionary-mode #wordDetail,.learn-layout.dictionary-mode #learningSections,.learn-layout.dictionary-mode .learn-aside{display:none!important}
.learn-layout.dictionary-mode #lexiconDetail{display:block!important}

.source-note{font-size:13px;margin:13px 0;color:#776453}

.verified-phonetic{padding:4px 0;color:#b46c4a;font-size:13px}

.root-library-toggle{display:flex;gap:6px;background:#fff4e9;padding:5px;border-radius:14px;border:1px solid #efd7c5;margin:8px 0 16px;width:max-content;max-width:100%}

.root-library-toggle button.active{background:#ce8367;color:#fff;box-shadow:0 3px 8px #ce83672c}
.selected-root-panel{padding:25px 30px;margin-bottom:20px;scroll-margin-top:85px}
.root-panel-top{display:flex;align-items:start;justify-content:space-between;gap:14px}
.root-panel-top h2{font-size:clamp(26px,3vw,36px);line-height:1.25;margin:9px 0 5px;font-family:Georgia,serif;overflow-wrap:anywhere}
.root-definition{margin:4px 0;color:#815e4a;font-size:16px}
.root-close{border:1px solid #eed8c7;border-radius:10px;background:white;padding:6px 10px;color:#88563d}
.root-facts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
.root-facts>div{background:#fff7ee;border:1px solid #f1dfd0;border-radius:12px;padding:11px 13px}
.root-facts small{color:#aa927b}.root-facts p{color:#604638;font-size:14px;margin:6px 0 0}
.root-word-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.root-word-chip{border:1px solid #eed8c6;background:#fffdf9;border-radius:12px;display:flex;flex-direction:column;align-items:start;text-align:left;gap:3px;min-width:0;padding:11px 13px;color:#674937}
.root-word-chip:hover{border-color:#d39b80;background:#fff6ee}
.root-word-chip strong{font-family:Georgia,serif;font-size:16px;overflow-wrap:anywhere}
.root-word-chip span{color:#9c8472;font-size:12px;display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.root-subtitle{font-size:16px;margin:18px 0 10px}
.source-status{font-size:12px;color:#6f865b;background:#f3f8ea;padding:8px 12px;border-radius:8px}
.source-status.needs-review{background:#fff5e9;color:#986d4e}
.source-label{display:block;color:#9a806e;font-size:10px;margin-top:8px}
.root-evidence{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:15px;background:#fff6ed;border-radius:11px;padding:10px 12px;color:#805e45;font-size:12px}
.root-evidence a{color:#b67251}
.root-family-extra{padding-top:15px;border-top:1px dashed #ead4bf;margin-top:15px}

  <script>window.ROOTLAB_DATA=[{"id":"ced","label":"ced / cess","meaning":"走；前进；让步","source":"来自拉丁语 cedere（行进、让步）。ced、cede、ceed、cess 是该词根的不同形式，可用于理解“前进、后退、过程、接续、让步”等词义。","mnemonic":"以“走、行进”为核心，将不同方向的前缀与 ced、cede、ceed、cess 联系起来，对比每个单词的实际含义。","forms":["ced","cede","ceed","cess"],"groups":[{"title":"结果与达成","note":"从“事情接着发生”逐渐引申出结果、成功。","entries":[{"word":"success","meaning":"成功；成就","pos":"n.","segments":["suc","cess"],"levels":["中考","高考","四级","六级","考研"],"example":"Success takes time and patience.","translation":"成功需要时间和耐心。","labelSource":"ECDICT"},{"word":"successful","meaning":"成功的；有成效的","pos":"adj.","segments":["suc","cess","ful"],"levels":["中考","高考","四级","六级","考研"],"example":"The project was successful.","translation":"这个项目取得了成功。","labelSource":"ECDICT"},{"word":"successfully","meaning":"成功地","pos":"adv.","segments":["suc","cess","ful","ly"],"levels":["四级","六级"],"example":"She successfully completed the task.","translation":"她顺利完成了任务。","labelSource":"ECDICT"},{"word":"succeed","meaning":"成功；继任","pos":"v.","segments":["suc","ceed"],"levels":["中考","高考","四级","六级","考研"],"example":"You can succeed through steady practice.","translation":"通过持续练习，你可以成功。","labelSource":"ECDICT"},{"word":"successor","meaning":"继任者；接班人","pos":"n.","segments":["suc","cess","or"],"levels":["六级","考研"],"example":"The company named a successor.","translation":"公司任命了一位继任者。","labelSource":"ECDICT"},{"word":"succession","meaning":"连续；继承","pos":"n.","segments":["suc","cess","ion"],"levels":["四级","六级","考研"],"example":"A succession of storms hit the coast.","translation":"一连串风暴袭击了海岸。","labelSource":"ECDICT"},{"word":"successive","meaning":"连续的；接连的","pos":"adj.","segments":["suc","cess","ive"],"levels":["四级","六级","考研"],"example":"Sales rose for three successive quarters.","translation":"销售额连续三个季度增长。","labelSource":"ECDICT"}]},{"title":"过程与推进","note":"pro- 带有“向前”的方向感。","entries":[{"word":"process","meaning":"过程；加工；处理","pos":"n./v.","segments":["pro","cess"],"levels":["高考","四级","六级","考研"],"example":"Learning a language is a gradual process.","translation":"学习语言是一个循序渐进的过程。","labelSource":"ECDICT"},{"word":"proceed","meaning":"继续进行；前进","pos":"v.","segments":["pro","ceed"],"levels":["四级","六级","考研"],"example":"Please proceed to the next step.","translation":"请继续进行下一步。","labelSource":"ECDICT"},{"word":"procedure","meaning":"程序；步骤","pos":"n.","segments":["pro","ced","ure"],"levels":["高考","四级","六级","考研"],"example":"Follow the safety procedure.","translation":"遵循安全操作程序。","labelSource":"ECDICT"},{"word":"procession","meaning":"队伍；行列","pos":"n.","segments":["pro","cess","ion"],"levels":["四级","六级","考研"],"example":"A procession moved slowly through the city.","translation":"游行队伍缓缓穿过城市。","labelSource":"ECDICT"}]},{"title":"进入、退让与超出","note":"不同前缀让同一词根出现不同的“方向”。","entries":[{"word":"access","meaning":"进入；使用权；访问","pos":"n./v.","segments":["ac","cess"],"levels":["高考","四级","六级","考研"],"example":"Students have access to the library.","translation":"学生可以使用图书馆。","labelSource":"ECDICT"},{"word":"accessible","meaning":"可到达的；可使用的","pos":"adj.","segments":["ac","cess","ible"],"levels":["高考","六级"],"example":"The website is accessible on mobile phones.","translation":"这个网站可以在手机上访问。","labelSource":"ECDICT"},{"word":"recession","meaning":"经济衰退；退后","pos":"n.","segments":["re","cess","ion"],"levels":["六级","考研"],"example":"The economy entered a recession.","translation":"经济进入衰退期。","labelSource":"ECDICT"},{"word":"recede","meaning":"后退；逐渐远去","pos":"v.","segments":["re","cede"],"levels":["考研"],"example":"The floodwater began to recede.","translation":"洪水开始消退。","labelSource":"ECDICT"},{"word":"concede","meaning":"承认；让步","pos":"v.","segments":["con","cede"],"levels":["六级","考研"],"example":"He conceded that the plan had flaws.","translation":"他承认该计划存在缺陷。","labelSource":"ECDICT"},{"word":"concession","meaning":"让步；特许权","pos":"n.","segments":["con","cess","ion"],"levels":["六级","考研"],"example":"Both sides made concessions during talks.","translation":"双方在谈判中都作出了让步。","labelSource":"ECDICT"},{"word":"precede","meaning":"先于；在……之前发生","pos":"v.","segments":["pre","cede"],"levels":["六级","考研"],"example":"A short introduction preceded the speech.","translation":"演讲前有一段简短介绍。","labelSource":"ECDICT"},{"word":"precedent","meaning":"先例；惯例","pos":"n.","segments":["pre","ced","ent"],"levels":["六级","考研"],"example":"The decision set an important precedent.","translation":"这一决定开创了一个重要先例。","labelSource":"ECDICT"},{"word":"excess","meaning":"过量；超出","pos":"n./adj.","segments":["ex","cess"],"levels":["四级","六级","考研"],"example":"Excess sugar can affect your health.","translation":"摄入过多糖分可能影响健康。","labelSource":"ECDICT"},{"word":"excessive","meaning":"过度的","pos":"adj.","segments":["ex","cess","ive"],"levels":["四级","六级","考研"],"example":"Excessive spending can cause problems.","translation":"过度支出可能引发问题。","labelSource":"ECDICT"}]}]},{"id":"spect","label":"spect / spic","meaning":"看；观察","source":"源自拉丁语 specere / spectare（看、观察），相关词形还包括 spic。英语中部分拼写或词义已发生历史演变。","mnemonic":"in- 向里看是 inspect；re- 回头看是 respect（历史上有“回望、重视”之意）；pro- 向前看是 prospect。","forms":["spect","spic"],"groups":[{"title":"观察与检查","note":"注意“观察方向”变化带来的语义。","entries":[{"word":"inspect","meaning":"检查；视察","pos":"v.","segments":["in","spect"],"levels":["高考","四级","六级","考研"],"example":"The engineer inspected the machine.","translation":"工程师检查了机器。","labelSource":"ECDICT"},{"word":"inspection","meaning":"检查；视察","pos":"n.","segments":["in","spect","ion"],"levels":["四级","六级"],"example":"The building passed the safety inspection.","translation":"这栋建筑通过了安全检查。","labelSource":"ECDICT"},{"word":"inspector","meaning":"检查员；督察","pos":"n.","segments":["in","spect","or"],"levels":["六级"],"example":"An inspector checked the equipment.","translation":"一名检查员检查了设备。","labelSource":"ECDICT"},{"word":"spectator","meaning":"观众；旁观者","pos":"n.","segments":["spect","at","or"],"levels":["六级","考研"],"example":"The spectators cheered loudly.","translation":"观众大声欢呼。","labelSource":"ECDICT"},{"word":"spectacle","meaning":"壮观场面；奇观","pos":"n.","segments":["spect","acle"],"levels":["四级","六级","考研"],"example":"The fireworks were a wonderful spectacle.","translation":"烟火表演是一场精彩的视觉盛宴。","labelSource":"ECDICT"}]},{"title":"态度与展望","note":"看到事情的另一面，产生尊重或预期。","entries":[{"word":"respect","meaning":"尊重；方面","pos":"n./v.","segments":["re","spect"],"levels":["高考","四级","六级","考研"],"example":"We should respect different opinions.","translation":"我们应尊重不同意见。","labelSource":"ECDICT"},{"word":"respectful","meaning":"恭敬的；表示尊重的","pos":"adj.","segments":["re","spect","ful"],"levels":["四级","六级"],"example":"She remained respectful during the debate.","translation":"她在辩论中始终保持尊重。","labelSource":"ECDICT"},{"word":"prospect","meaning":"前景；可能性","pos":"n.","segments":["pro","spect"],"levels":["四级","六级","考研"],"example":"The job offers good career prospects.","translation":"这份工作有良好的职业发展前景。","labelSource":"ECDICT"},{"word":"prospective","meaning":"预期的；未来的","pos":"adj.","segments":["pro","spect","ive"],"levels":["六级","考研"],"example":"We met several prospective customers.","translation":"我们会见了几位潜在客户。","labelSource":"ECDICT"},{"word":"perspective","meaning":"视角；观点；透视","pos":"n.","segments":["per","spect","ive"],"levels":["四级","六级","考研"],"example":"Try to see the issue from her perspective.","translation":"试着从她的角度看这个问题。","labelSource":"ECDICT"},{"word":"retrospect","meaning":"回顾","pos":"n.","segments":["retro","spect"],"levels":["六级","考研"],"example":"In retrospect, the decision was sensible.","translation":"回头看，这个决定是明智的。","labelSource":"ECDICT"},{"word":"suspect","meaning":"怀疑；嫌疑人","pos":"v./n.","segments":["sus","pect"],"levels":["高考","四级","六级","考研"],"example":"The police suspect that the report is false.","translation":"警方怀疑这份报告不真实。","labelSource":"ECDICT"}]}]},{"id":"port","label":"port","meaning":"携带；搬运","source":"来自拉丁语 portare（携带、运送）。注意英语 port（港口）也有另一条“港口”词源路线，并非所有 port 字样的词都来自“搬运”。","mnemonic":"trans- 跨越地搬运，是 transport；ex- 向外运，是 export；im- 向内运，是 import。","forms":["port"],"groups":[{"title":"运输与贸易","note":"方向性前缀能帮你辨别进出口。","entries":[{"word":"transport","meaning":"运输；交通工具","pos":"v./n.","segments":["trans","port"],"levels":["高考","四级","六级","考研"],"example":"The goods are transported by rail.","translation":"货物通过铁路运输。","labelSource":"ECDICT"},{"word":"transportation","meaning":"运输；交通","pos":"n.","segments":["trans","port","ation"],"levels":["四级","六级"],"example":"Public transportation is convenient here.","translation":"这里的公共交通很便利。","labelSource":"ECDICT"},{"word":"import","meaning":"进口；进口商品","pos":"v./n.","segments":["im","port"],"levels":["高考","四级","六级","考研"],"example":"The country imports most of its oil.","translation":"该国进口大部分石油。","labelSource":"ECDICT"},{"word":"export","meaning":"出口；出口商品","pos":"v./n.","segments":["ex","port"],"levels":["高考","四级","考研"],"example":"The company exports products worldwide.","translation":"公司向世界各地出口产品。","labelSource":"ECDICT"},{"word":"portable","meaning":"便携的","pos":"adj.","segments":["port","able"],"levels":["高考","四级","六级","考研"],"example":"This portable speaker is easy to carry.","translation":"这款便携式音箱方便携带。","labelSource":"ECDICT"}]},{"title":"支撑与陈述","note":"抽象的“携带”产生支持、报告等意义。","entries":[{"word":"support","meaning":"支持；支撑","pos":"v./n.","segments":["sup","port"],"levels":["高考","四级","六级","考研"],"example":"We support the new proposal.","translation":"我们支持这项新提案。","labelSource":"ECDICT"},{"word":"supportive","meaning":"支持性的","pos":"adj.","segments":["sup","port","ive"],"levels":[],"example":"Her colleagues were supportive of the plan.","translation":"她的同事支持这项计划。","labelSource":"ECDICT"},{"word":"report","meaning":"报告；报道","pos":"n./v.","segments":["re","port"],"levels":["中考","高考"],"example":"Please report the results tomorrow.","translation":"请明天报告结果。","labelSource":"ECDICT"},{"word":"reporter","meaning":"记者；报告人","pos":"n.","segments":["re","port","er"],"levels":["高考","四级","六级","考研"],"example":"The reporter interviewed several witnesses.","translation":"记者采访了几位目击者。","labelSource":"ECDICT"},{"word":"deport","meaning":"驱逐出境","pos":"v.","segments":["de","port"],"levels":[],"example":"The authorities decided to deport him.","translation":"当局决定将他驱逐出境。","labelSource":"ECDICT"}]}]},{"id":"tract","label":"tract","meaning":"拉；牵引","source":"源自拉丁语 trahere（拉、拖）的过去分词词干 tract-，可从“拉动方向”联想语义。","mnemonic":"at- 拉向自己是 attract；dis- 拉开注意力是 distract；ex- 往外拉是 extract。","forms":["tract"],"groups":[{"title":"吸引与分散","note":"把注意力想象为可被拉动的东西。","entries":[{"word":"attract","meaning":"吸引","pos":"v.","segments":["at","tract"],"levels":["高考","四级","考研"],"example":"Bright colors attract attention.","translation":"鲜艳的颜色能够吸引注意力。","labelSource":"ECDICT"},{"word":"attraction","meaning":"吸引；景点","pos":"n.","segments":["at","tract","ion"],"levels":["高考","四级"],"example":"The museum is a popular tourist attraction.","translation":"这座博物馆是热门旅游景点。","labelSource":"ECDICT"},{"word":"attractive","meaning":"有吸引力的","pos":"adj.","segments":["at","tract","ive"],"levels":["高考","四级","考研"],"example":"The company offers an attractive salary.","translation":"公司提供有吸引力的薪资。","labelSource":"ECDICT"},{"word":"distract","meaning":"使分心","pos":"v.","segments":["dis","tract"],"levels":["六级","考研"],"example":"Noise can distract students.","translation":"噪音会使学生分心。","labelSource":"ECDICT"},{"word":"distraction","meaning":"分心的事物","pos":"n.","segments":["dis","tract","ion"],"levels":[],"example":"Noise is a major distraction when studying.","translation":"学习时噪声是一大干扰。","labelSource":"ECDICT"}]},{"title":"抽取与约束","note":"向外拉、向内收和往回拉。","entries":[{"word":"extract","meaning":"提取；摘录","pos":"v./n.","segments":["ex","tract"],"levels":["六级","考研"],"example":"Scientists extracted DNA from the sample.","translation":"科学家从样本中提取了 DNA。","labelSource":"ECDICT"},{"word":"extraction","meaning":"提取；抽出","pos":"n.","segments":["ex","tract","ion"],"levels":["六级"],"example":"The process involves the extraction of oil.","translation":"这一过程涉及石油开采。","labelSource":"ECDICT"},{"word":"contract","meaning":"合同；收缩；感染","pos":"n./v.","segments":["con","tract"],"levels":["四级","六级","考研"],"example":"Both parties signed the contract.","translation":"双方签署了合同。","labelSource":"ECDICT"},{"word":"contraction","meaning":"收缩；缩略形式","pos":"n.","segments":["con","tract","ion"],"levels":[],"example":"A contraction in demand hurt sales.","translation":"需求收缩影响了销售。","labelSource":"ECDICT"},{"word":"subtract","meaning":"减去","pos":"v.","segments":["sub","tract"],"levels":["四级","六级","考研"],"example":"Subtract five from twelve to get seven.","translation":"十二减去五等于七。","labelSource":"ECDICT"},{"word":"retract","meaning":"撤回；缩回","pos":"v.","segments":["re","tract"],"levels":[],"example":"The newspaper agreed to retract the claim.","translation":"报社同意撤回这一说法。","labelSource":"ECDICT"}]}]},{"id":"script","label":"scrib / script","meaning":"写；记录","source":"来自拉丁语 scribere（写）及其分词词干 script-。scrib、scribe、script 属于相关词形。","mnemonic":"de- 往下写、描写是 describe；trans- 转写是 transcript；pre- 预先写下是 prescribe。","forms":["scrib","scribe","script"],"groups":[{"title":"书写与描绘","note":"从文字记录到详细描述。","entries":[{"word":"describe","meaning":"描述","pos":"v.","segments":["de","scribe"],"levels":["中考","高考","四级","六级","考研"],"example":"Can you describe what happened?","translation":"你能描述发生了什么吗？","labelSource":"ECDICT"},{"word":"description","meaning":"描述；说明","pos":"n.","segments":["de","script","ion"],"levels":["高考","四级","六级","考研"],"example":"The product description is easy to understand.","translation":"产品说明很容易理解。","labelSource":"ECDICT"},{"word":"descriptive","meaning":"描写性的","pos":"adj.","segments":["de","script","ive"],"levels":[],"example":"Use descriptive language in your writing.","translation":"在写作中使用描写性语言。","labelSource":"ECDICT"},{"word":"manuscript","meaning":"手稿；原稿","pos":"n.","segments":["manu","script"],"levels":["六级","考研"],"example":"The author finished the manuscript.","translation":"作者完成了手稿。","labelSource":"ECDICT"},{"word":"transcript","meaning":"文字记录；成绩单","pos":"n.","segments":["tran","script"],"levels":[],"example":"She requested an official transcript.","translation":"她申请了一份正式成绩单。","labelSource":"ECDICT"}]},{"title":"规定与订阅","note":"“事先写好”可以引出指示与约定。","entries":[{"word":"prescribe","meaning":"开处方；规定","pos":"v.","segments":["pre","scribe"],"levels":["四级","六级","考研"],"example":"The doctor prescribed some medicine.","translation":"医生开了一些药。","labelSource":"ECDICT"},{"word":"prescription","meaning":"处方；规定","pos":"n.","segments":["pre","script","ion"],"levels":["高考","六级","考研"],"example":"The pharmacist checked the prescription.","translation":"药剂师核对了处方。","labelSource":"ECDICT"},{"word":"subscribe","meaning":"订阅；认购","pos":"v.","segments":["sub","scribe"],"levels":["高考","六级","考研"],"example":"You can subscribe to the newsletter.","translation":"你可以订阅这份通讯。","labelSource":"ECDICT"},{"word":"subscription","meaning":"订阅；认购","pos":"n.","segments":["sub","script","ion"],"levels":["六级"],"example":"The subscription renews every month.","translation":"这项订阅每个月续费。","labelSource":"ECDICT"},{"word":"inscription","meaning":"刻写的文字；题词","pos":"n.","segments":["in","script","ion"],"levels":[],"example":"The stone bears an ancient inscription.","translation":"石头上刻着一段古老的铭文。","labelSource":"ECDICT"}]}]},{"id":"struct","label":"struct","meaning":"建造；组织","source":"源自拉丁语 struere（建造、排列），struct- 是相关分词词干。","mnemonic":"con- 共同建造，是 construct；in- 在内部建立认知结构，是 instruct；ob- 挡在前面建起障碍，是 obstruct。","forms":["struct"],"groups":[{"title":"搭建与结构","note":"把结构想象成逐层搭起来的框架。","entries":[{"word":"construct","meaning":"建造；构建","pos":"v.","segments":["con","struct"],"levels":["高考","四级","六级","考研"],"example":"Workers constructed a new bridge.","translation":"工人建造了一座新桥。","labelSource":"ECDICT"},{"word":"construction","meaning":"建设；建筑物","pos":"n.","segments":["con","struct","ion"],"levels":["高考","四级","六级","考研"],"example":"The new school is under construction.","translation":"新学校正在建设中。","labelSource":"ECDICT"},{"word":"constructive","meaning":"建设性的","pos":"adj.","segments":["con","struct","ive"],"levels":[],"example":"We had a constructive discussion.","translation":"我们进行了一次建设性的讨论。","labelSource":"ECDICT"},{"word":"reconstruct","meaning":"重建；重构","pos":"v.","segments":["re","con","struct"],"levels":[],"example":"Experts will reconstruct the damaged bridge.","translation":"专家将重建受损的桥梁。","labelSource":"ECDICT"},{"word":"structure","meaning":"结构；组织","pos":"n./v.","segments":["struct","ure"],"levels":["四级","六级","考研"],"example":"The essay has a clear structure.","translation":"这篇文章结构清晰。","labelSource":"ECDICT"},{"word":"structural","meaning":"结构的","pos":"adj.","segments":["struct","ur","al"],"levels":["四级","六级"],"example":"The engineer found a structural problem.","translation":"工程师发现了一个结构性问题。","labelSource":"ECDICT"}]},{"title":"指导与阻碍","note":"从“组织安排”引申到教学和阻挡。","entries":[{"word":"instruct","meaning":"指示；教导","pos":"v.","segments":["in","struct"],"levels":["高考","四级","六级","考研"],"example":"The coach instructed us to wait.","translation":"教练指示我们等待。","labelSource":"ECDICT"},{"word":"instruction","meaning":"指示；说明书；教学","pos":"n.","segments":["in","struct","ion"],"levels":["中考","高考","四级","六级","考研"],"example":"Please follow the instructions carefully.","translation":"请认真按照说明操作。","labelSource":"ECDICT"},{"word":"instructor","meaning":"指导员；教师","pos":"n.","segments":["in","struct","or"],"levels":["六级"],"example":"The instructor demonstrated each step.","translation":"指导老师演示了每一个步骤。","labelSource":"ECDICT"},{"word":"obstruct","meaning":"阻碍；阻塞","pos":"v.","segments":["ob","struct"],"levels":["考研"],"example":"Parked cars obstruct the narrow road.","translation":"停放的汽车阻碍了狭窄的道路。","labelSource":"ECDICT"},{"word":"obstruction","meaning":"障碍；阻塞","pos":"n.","segments":["ob","struct","ion"],"levels":["考研"],"example":"Workers removed the obstruction from the road.","translation":"工人清除了道路上的障碍。","labelSource":"ECDICT"}]}]},{"id":"dict","label":"dict","meaning":"说；宣告","source":"来自拉丁语 dicere（说）及相关词干 dict-；许多词带有“说出来、宣告”的画面。","mnemonic":"pre- 先说是 predict；contra- 对着说是 contradict；dict- 说的话汇集成 dictionary。","forms":["dict"],"groups":[{"title":"预言与表达","note":"把话语看作从口中说出的信息。","entries":[{"word":"predict","meaning":"预测；预言","pos":"v.","segments":["pre","dict"],"levels":["高考","四级","六级","考研"],"example":"Experts predict a rise in demand.","translation":"专家预测需求会上升。","labelSource":"ECDICT"},{"word":"prediction","meaning":"预测","pos":"n.","segments":["pre","dict","ion"],"levels":["六级"],"example":"Her prediction turned out to be correct.","translation":"她的预测后来被证明是正确的。","labelSource":"ECDICT"},{"word":"predictable","meaning":"可预测的","pos":"adj.","segments":["pre","dict","able"],"levels":[],"example":"The ending of the story was predictable.","translation":"这个故事的结局是可以预料的。","labelSource":"ECDICT"},{"word":"dictionary","meaning":"词典；字典","pos":"n.","segments":["dict","ion","ary"],"levels":["中考","高考"],"example":"Look up the word in a dictionary.","translation":"在词典里查这个词。","labelSource":"ECDICT"},{"word":"diction","meaning":"措辞；发音方式","pos":"n.","segments":["dict","ion"],"levels":[],"example":"Clear diction makes a speech easier to follow.","translation":"清晰的吐字使演讲更容易理解。","labelSource":"ECDICT"}]},{"title":"命令与反驳","note":"谁在说、说了什么与如何回应。","entries":[{"word":"dictate","meaning":"口述；命令；决定","pos":"v.","segments":["dict","ate"],"levels":["四级","六级","考研"],"example":"The terms were dictated by the supplier.","translation":"条款由供应商决定。","labelSource":"ECDICT"},{"word":"dictator","meaning":"独裁者","pos":"n.","segments":["dict","at","or"],"levels":["六级"],"example":"The dictator refused to share power.","translation":"独裁者拒绝分享权力。","labelSource":"ECDICT"},{"word":"contradict","meaning":"反驳；与……矛盾","pos":"v.","segments":["contra","dict"],"levels":["高考","六级","考研"],"example":"The evidence contradicts his story.","translation":"证据与他的说法矛盾。","labelSource":"ECDICT"},{"word":"contradiction","meaning":"矛盾；反驳","pos":"n.","segments":["contra","dict","ion"],"levels":["四级","六级","考研"],"example":"There is a contradiction in his statement.","translation":"他的陈述存在矛盾。","labelSource":"ECDICT"},{"word":"verdict","meaning":"裁决；判决","pos":"n.","segments":["ver","dict"],"levels":["六级","考研"],"example":"The jury reached a verdict yesterday.","translation":"陪审团昨天作出了裁决。","labelSource":"ECDICT"}]}]},{"id":"vis","label":"vis / vid","meaning":"看；视见","source":"来自拉丁语 videre（看），有 vis-、vid- 等派生形式，部分词义已从视觉转为预见、判断。","mnemonic":"vis- 是看得见的 visible；re- 再次看，是 revise；super- 从上方看，是 supervise。","forms":["vis","vid"],"groups":[{"title":"可见与视觉","note":"从看到一幅画面，联想到视野与影像。","entries":[{"word":"visible","meaning":"可见的；明显的","pos":"adj.","segments":["vis","ible"],"levels":["四级","六级","考研"],"example":"The stars are clearly visible tonight.","translation":"今晚星星清晰可见。","labelSource":"ECDICT"},{"word":"invisible","meaning":"看不见的；无形的","pos":"adj.","segments":["in","vis","ible"],"levels":["四级","六级","考研"],"example":"Some insects are almost invisible.","translation":"有些昆虫几乎看不见。","labelSource":"ECDICT"},{"word":"vision","meaning":"视力；远见；愿景","pos":"n.","segments":["vis","ion"],"levels":["四级","六级","考研"],"example":"She has a clear vision for the team.","translation":"她对团队有清晰的愿景。","labelSource":"ECDICT"},{"word":"visual","meaning":"视觉的","pos":"adj.","segments":["vis","ual"],"levels":["高考","四级","六级","考研"],"example":"The report includes visual examples.","translation":"报告包含图示。","labelSource":"ECDICT"},{"word":"video","meaning":"视频；录像","pos":"n.","segments":["vid","eo"],"levels":["中考","高考","四级","六级","考研"],"example":"We watched a short science video.","translation":"我们看了一个简短的科学视频。","labelSource":"ECDICT"}]},{"title":"再看与监督","note":"换一个角度或再次查看。","entries":[{"word":"revise","meaning":"修订；复习","pos":"v.","segments":["re","vis","e"],"levels":["四级","六级","考研"],"example":"Please revise the document before Friday.","translation":"请在周五之前修改文件。","labelSource":"ECDICT"},{"word":"revision","meaning":"修订；复习","pos":"n.","segments":["re","vis","ion"],"levels":["高考","六级"],"example":"The document needs another revision.","translation":"这份文件还需要修订一次。","labelSource":"ECDICT"},{"word":"supervise","meaning":"监督；管理","pos":"v.","segments":["super","vis","e"],"levels":["六级","考研"],"example":"A senior engineer supervises the work.","translation":"一位资深工程师监督这项工作。","labelSource":"ECDICT"},{"word":"supervisor","meaning":"主管；监督者","pos":"n.","segments":["super","vis","or"],"levels":[],"example":"Ask your supervisor before making changes.","translation":"做出修改前先询问主管。","labelSource":"ECDICT"},{"word":"evidence","meaning":"证据；迹象","pos":"n.","segments":["e","vid","ence"],"levels":["高考","四级","六级","考研"],"example":"There is strong evidence for this theory.","translation":"有充分证据支持这一理论。","labelSource":"ECDICT"}]}]},{"id":"form","label":"form","meaning":"形状；形式","source":"来自拉丁语 forma（形状、外形）。相关词可以由“形状改变、成形、使符合形式”联想。","mnemonic":"trans- 改换形状是 transform；re- 重新塑形是 reform；uni- 统一形状是 uniform。","forms":["form"],"groups":[{"title":"形态与变化","note":"保持或改变某种形式。","entries":[{"word":"form","meaning":"形式；表格；形成","pos":"n./v.","segments":["form"],"levels":["中考","高考"],"example":"Please fill in this form.","translation":"请填写这张表格。","labelSource":"ECDICT"},{"word":"formal","meaning":"正式的","pos":"adj.","segments":["form","al"],"levels":["四级","六级","考研"],"example":"The event requires formal clothing.","translation":"活动要求穿正装。","labelSource":"ECDICT"},{"word":"formation","meaning":"形成；编队","pos":"n.","segments":["form","ation"],"levels":["四级","六级","考研"],"example":"The clouds changed formation.","translation":"云层改变了形状。","labelSource":"ECDICT"},{"word":"transform","meaning":"改变；转变","pos":"v.","segments":["trans","form"],"levels":["高考","四级","六级","考研"],"example":"Technology can transform education.","translation":"技术能够改变教育。","labelSource":"ECDICT"},{"word":"transformation","meaning":"转型；变化","pos":"n.","segments":["trans","form","ation"],"levels":["四级","六级"],"example":"The city has undergone a major transformation.","translation":"这座城市经历了重大转型。","labelSource":"ECDICT"},{"word":"reform","meaning":"改革；改进","pos":"n./v.","segments":["re","form"],"levels":["高考","四级","六级","考研"],"example":"The policy aims to reform the system.","translation":"这项政策旨在改革制度。","labelSource":"ECDICT"}]},{"title":"信息与一致","note":"信息的词源可联想为“赋予心智形式”。","entries":[{"word":"inform","meaning":"通知；告知","pos":"v.","segments":["in","form"],"levels":["高考","四级","六级","考研"],"example":"Please inform me of any changes.","translation":"如有变化请通知我。","labelSource":"ECDICT"},{"word":"information","meaning":"信息；资料","pos":"n.","segments":["in","form","ation"],"levels":["中考","高考"],"example":"The report contains useful information.","translation":"报告包含有用的信息。","labelSource":"ECDICT"},{"word":"uniform","meaning":"制服；统一的","pos":"n./adj.","segments":["uni","form"],"levels":["高考","四级","六级","考研"],"example":"Students wear a uniform at school.","translation":"学生在学校穿校服。","labelSource":"ECDICT"},{"word":"conform","meaning":"遵从；符合","pos":"v.","segments":["con","form"],"levels":["六级","考研"],"example":"The product must conform to safety standards.","translation":"产品必须符合安全标准。","labelSource":"ECDICT"},{"word":"deform","meaning":"使变形","pos":"v.","segments":["de","form"],"levels":["六级","考研"],"example":"Too much heat can deform the plastic.","translation":"高温可能使塑料变形。","labelSource":"ECDICT"}]}]},{"id":"bio","label":"bio","meaning":"生命；生物","source":"源自希腊语 bios（生命）；常见于生命科学及现代科学的复合词中。","mnemonic":"bio + logy：研究生命就是 biology；bio + graphy：写下生命经历就是 biography。","forms":["bio","biot"],"groups":[{"title":"生命科学","note":"记住 bio=生命，看到学科名称先辨另一部分。","entries":[{"word":"biology","meaning":"生物学","pos":"n.","segments":["bio","logy"],"levels":["高考","四级","考研"],"example":"Biology explores how living things work.","translation":"生物学探索生命体如何运作。","labelSource":"ECDICT"},{"word":"biological","meaning":"生物的；生物学的","pos":"adj.","segments":["bio","log","ical"],"levels":[],"example":"Biological research requires careful observation.","translation":"生物学研究需要细致观察。","labelSource":"ECDICT"},{"word":"biotechnology","meaning":"生物技术","pos":"n.","segments":["bio","techno","logy"],"levels":[],"example":"Biotechnology plays a role in medicine.","translation":"生物技术在医学中发挥作用。","labelSource":"ECDICT"},{"word":"microbiology","meaning":"微生物学","pos":"n.","segments":["micro","bio","logy"],"levels":[],"example":"Microbiology studies tiny living organisms.","translation":"微生物学研究微小的生物体。","labelSource":"ECDICT"},{"word":"biodegradable","meaning":"可生物降解的","pos":"adj.","segments":["bio","de","grad","able"],"levels":[],"example":"This bag is made of biodegradable material.","translation":"这个袋子由可生物降解材料制成。","labelSource":"ECDICT"}]},{"title":"生活与经历","note":"从生命延伸到人生记述。","entries":[{"word":"biography","meaning":"传记","pos":"n.","segments":["bio","graphy"],"levels":["高考","考研"],"example":"I am reading a biography of a scientist.","translation":"我正在读一本科学家传记。","labelSource":"ECDICT"},{"word":"autobiography","meaning":"自传","pos":"n.","segments":["auto","bio","graphy"],"levels":["四级"],"example":"He wrote an autobiography about his childhood.","translation":"他写了一本关于童年的自传。","labelSource":"ECDICT"},{"word":"biosphere","meaning":"生物圈","pos":"n.","segments":["bio","sphere"],"levels":[],"example":"The biosphere supports diverse forms of life.","translation":"生物圈支撑着多种生命形式。","labelSource":"ECDICT"}]}]},{"id":"graph","label":"graph","meaning":"写；绘制；记录","source":"来自希腊语 graphein（写、画），graph、graphy 常见于记录、图形和学科名称。","mnemonic":"photo- 光 + graph 是 photograph；geo- 地 + graphy 是 geography。","forms":["graph","graphy"],"groups":[{"title":"图片与记录","note":"把一个印象写下或画下来。","entries":[{"word":"graph","meaning":"图表；曲线图","pos":"n.","segments":["graph"],"levels":["高考","四级","六级","考研"],"example":"The graph shows a clear trend.","translation":"图表显示出明显趋势。","labelSource":"ECDICT"},{"word":"graphic","meaning":"图像的；生动的","pos":"adj.","segments":["graph","ic"],"levels":["考研"],"example":"The article uses clear graphic illustrations.","translation":"文章使用了清晰的图解。","labelSource":"ECDICT"},{"word":"photograph","meaning":"照片；拍照","pos":"n./v.","segments":["photo","graph"],"levels":["中考","高考","四级","六级"],"example":"She took a photograph of the mountain.","translation":"她拍了一张山的照片。","labelSource":"ECDICT"},{"word":"photography","meaning":"摄影术","pos":"n.","segments":["photo","graphy"],"levels":["六级"],"example":"He studies photography at college.","translation":"他在大学学习摄影。","labelSource":"ECDICT"},{"word":"autograph","meaning":"亲笔签名","pos":"n.","segments":["auto","graph"],"levels":[],"example":"The athlete signed an autograph for a fan.","translation":"运动员为粉丝签了名。","labelSource":"ECDICT"}]},{"title":"记录与学科","note":"由写下信息延伸到系统描述。","entries":[{"word":"geography","meaning":"地理学","pos":"n.","segments":["geo","graphy"],"levels":["中考","高考","四级","六级","考研"],"example":"We study geography at school.","translation":"我们在学校学习地理。","labelSource":"ECDICT"},{"word":"geographic","meaning":"地理的","pos":"adj.","segments":["geo","graph","ic"],"levels":[],"example":"The report covers a wide geographic area.","translation":"报告覆盖了广泛的地理区域。","labelSource":"ECDICT"},{"word":"biography","meaning":"传记","pos":"n.","segments":["bio","graphy"],"levels":["高考","考研"],"example":"I read a biography of the scientist.","translation":"我读了一本科学家的传记。","labelSource":"ECDICT"},{"word":"paragraph","meaning":"段落","pos":"n.","segments":["para","graph"],"levels":["高考","四级","六级","考研"],"example":"Write one paragraph about your hometown.","translation":"写一段关于你家乡的文字。","labelSource":"ECDICT"},{"word":"telegraph","meaning":"电报；电报机","pos":"n.","segments":["tele","graph"],"levels":["高考","四级","六级","考研"],"example":"The telegraph changed long-distance messaging.","translation":"电报改变了远距离信息传递的方式。","labelSource":"ECDICT"}]}]},{"id":"phon","label":"phon","meaning":"声音；语音","source":"来自希腊语 phone（声音），常见于声音装置与语言学术语。","mnemonic":"tele- 远 + phone 是电话；micro- 小 + phone 是收音设备 microphone。","forms":["phon","phone"],"groups":[{"title":"设备与传声","note":"与声音的产生、传递相关。","entries":[{"word":"phone","meaning":"电话；打电话","pos":"n./v.","segments":["phone"],"levels":["中考","四级","考研"],"example":"My phone is on the desk.","translation":"我的电话在桌上。","labelSource":"ECDICT"},{"word":"telephone","meaning":"电话","pos":"n./v.","segments":["tele","phone"],"levels":["中考","高考"],"example":"The telephone changed long-distance communication.","translation":"电话改变了远距离通信。","labelSource":"ECDICT"},{"word":"microphone","meaning":"麦克风","pos":"n.","segments":["micro","phone"],"levels":["四级","六级","考研"],"example":"Please speak into the microphone.","translation":"请对着麦克风讲话。","labelSource":"ECDICT"},{"word":"megaphone","meaning":"扩音器","pos":"n.","segments":["mega","phone"],"levels":[],"example":"The guide used a megaphone to speak.","translation":"导游用扩音器讲话。","labelSource":"ECDICT"}]},{"title":"发音与语言","note":"认识声音的基本单位。","entries":[{"word":"phonetic","meaning":"语音的；音标的","pos":"adj.","segments":["phon","et","ic"],"levels":[],"example":"The dictionary includes phonetic symbols.","translation":"词典附有音标。","labelSource":"ECDICT"},{"word":"phoneme","meaning":"音位","pos":"n.","segments":["phon","eme"],"levels":[],"example":"A phoneme can change a word's meaning.","translation":"一个音素可能改变单词的含义。","labelSource":"ECDICT"},{"word":"phonology","meaning":"音系学","pos":"n.","segments":["phon","ology"],"levels":[],"example":"Phonology examines patterns of speech sounds.","translation":"音系学研究语言声音的模式。","labelSource":"ECDICT"},{"word":"homophone","meaning":"同音词","pos":"n.","segments":["homo","phone"],"levels":[],"example":"“Sea” and “see” are homophones.","translation":"sea 和 see 是同音词。","labelSource":"ECDICT"},{"word":"symphony","meaning":"交响曲","pos":"n.","segments":["sym","phon","y"],"levels":["高考","六级","考研"],"example":"We listened to a famous symphony.","translation":"我们聆听了一首著名的交响乐。","labelSource":"ECDICT"}]}]},{"id":"chron","label":"chron","meaning":"时间","source":"来自希腊语 chronos（时间）；不少医学、科技、历史词汇包含此成分。","mnemonic":"chrono- 时间 + logy 是年代学；syn- 同时 + chronize 是同步。","forms":["chron","chrono"],"groups":[{"title":"时间与先后","note":"重点记住同步与时间顺序。","entries":[{"word":"chronology","meaning":"年代顺序；编年学","pos":"n.","segments":["chrono","logy"],"levels":[],"example":"The events are listed in chronological order.","translation":"这些事件按时间顺序排列。","labelSource":"ECDICT"},{"word":"chronological","meaning":"按时间顺序的","pos":"adj.","segments":["chrono","log","ical"],"levels":[],"example":"Arrange the documents in chronological order.","translation":"把文件按时间顺序排列。","labelSource":"ECDICT"},{"word":"chronicle","meaning":"编年史；记载","pos":"n./v.","segments":["chron","icle"],"levels":["六级"],"example":"The book chronicles the city's history.","translation":"这本书记述了这座城市的历史。","labelSource":"ECDICT"},{"word":"synchronize","meaning":"使同步","pos":"v.","segments":["syn","chron","ize"],"levels":["考研"],"example":"The devices synchronize automatically.","translation":"这些设备会自动同步。","labelSource":"ECDICT"},{"word":"synchronized","meaning":"同步的","pos":"adj.","segments":["syn","chron","ized"],"levels":[],"example":"The two clocks are perfectly synchronized.","translation":"这两只钟完全同步。","labelSource":"ECDICT"},{"word":"asynchronous","meaning":"异步的","pos":"adj.","segments":["a","syn","chron","ous"],"levels":[],"example":"Our team uses asynchronous communication.","translation":"我们的团队采用异步沟通方式。","labelSource":"ECDICT"}]},{"title":"持续与错位","note":"现代用法中，chronic 往往和长期情况有关。","entries":[{"word":"chronic","meaning":"慢性的；长期的","pos":"adj.","segments":["chron","ic"],"levels":["六级","考研"],"example":"Stress may become a chronic problem.","translation":"压力可能成为长期问题。","labelSource":"ECDICT"},{"word":"anachronism","meaning":"时代错误；不合时宜之物","pos":"n.","segments":["ana","chron","ism"],"levels":[],"example":"A smartphone in that historical film is an anachronism.","translation":"历史电影中的智能手机属于时代错误。","labelSource":"ECDICT"}]}]},{"id":"cred","label":"cred","meaning":"相信；信任","source":"源自拉丁语 credere（相信、信任）。现代的 credit 同样有“信任、信用”背景。","mnemonic":"cred- 相信：credible 是可信的；in- 取反，就是 incredible。","forms":["cred"],"groups":[{"title":"可信与怀疑","note":"从“信任”到“有可信度”。","entries":[{"word":"credible","meaning":"可信的；可靠的","pos":"adj.","segments":["cred","ible"],"levels":[],"example":"We need credible evidence.","translation":"我们需要可信的证据。","labelSource":"ECDICT"},{"word":"incredible","meaning":"难以置信的；极好的","pos":"adj.","segments":["in","cred","ible"],"levels":["六级","考研"],"example":"The view was incredible.","translation":"景色美得难以置信。","labelSource":"ECDICT"},{"word":"credibility","meaning":"可信度；公信力","pos":"n.","segments":["cred","ibil","ity"],"levels":[],"example":"Transparency improves the report's credibility.","translation":"透明度提高了报告的可信度。","labelSource":"ECDICT"},{"word":"credulous","meaning":"轻信的","pos":"adj.","segments":["cred","ul","ous"],"levels":[],"example":"A credulous reader may believe that rumor.","translation":"轻信的读者可能会相信那则谣言。","labelSource":"ECDICT"}]},{"title":"信用与资质","note":"“相信对方”是授信的出发点。","entries":[{"word":"credit","meaning":"信用；学分；赞誉","pos":"n./v.","segments":["cred","it"],"levels":["高考"],"example":"She received credit for her work.","translation":"她的工作获得了认可。","labelSource":"ECDICT"},{"word":"creditor","meaning":"债权人","pos":"n.","segments":["cred","it","or"],"levels":[],"example":"The company reached an agreement with its creditors.","translation":"公司与债权人达成了协议。","labelSource":"ECDICT"},{"word":"credential","meaning":"资格证书；资历证明","pos":"n.","segments":["cred","ent","ial"],"levels":["六级","考研"],"example":"The employer checked her credentials.","translation":"雇主核查了她的资历。","labelSource":"ECDICT"},{"word":"discredit","meaning":"使失去信誉；质疑","pos":"v.","segments":["dis","cred","it"],"levels":[],"example":"The scandal discredited the organization.","translation":"丑闻损害了该组织的信誉。","labelSource":"ECDICT"},{"word":"creed","meaning":"信条；信念","pos":"n.","segments":["creed"],"levels":[],"example":"The group follows a simple creed of honesty.","translation":"这个团体奉行诚实的简单信条。","labelSource":"ECDICT"}]}]},{"id":"mit","label":"mit / miss","meaning":"送；派遣","source":"来自拉丁语 mittere（发送）与分词词干 miss-。变形有时伴随同化和拼写变化。","mnemonic":"trans- 跨越地发送是 transmit；sub- 送上去是 submit；per- 允许通行就是 permit。","forms":["mit","miss","mis"],"groups":[{"title":"传递与提交","note":"理解从一处送往另一处的方向。","entries":[{"word":"transmit","meaning":"传输；传播","pos":"v.","segments":["trans","mit"],"levels":["四级","六级","考研"],"example":"The device transmits data wirelessly.","translation":"设备通过无线方式传输数据。","labelSource":"ECDICT"},{"word":"transmission","meaning":"传输；传播","pos":"n.","segments":["trans","miss","ion"],"levels":["四级","六级","考研"],"example":"The system supports fast data transmission.","translation":"该系统支持高速数据传输。","labelSource":"ECDICT"},{"w ["高考","四级","六级","考研"],"example":"We must commit enough time to the project.","translation":"我们必须为项目投入足够的时间。","labelSource":"ECDICT"}]}]},{"id":"ject","label":"ject","meaning":"投；掷；抛","source":"来自拉丁语 iacere（投掷）及分词形式 iactus 的相关派生形。","mnemonic":"pro- 向前投是 project；re- 扔回去是 reject；in- 扔进去是 inject。","forms":["ject"],"groups":[{"title":"方向与投射","note":"前缀就像箭头，为动作指明方向。","entries":[{"word":"project","meaning":"项目；投射；预测","pos":"n./v.","segments":["pro","ject"],"levels":["高考","四级","六级","考研"],"example":"Our project starts next month.","translation":"我们的项目下个月启动。","labelSource":"ECDICT"},{"word":"projection","meaning":"投影；预测","pos":"n.","segments":["pro","ject","ion"],"levels":[],"example":"The sales projection looks optimistic.","translation":"销售预测看起来比较乐观。","labelSource":"ECDICT"},{"word":"reject","meaning":"拒绝；驳回","pos":"v.","segments":["re","ject"],"levels":["高考","四级","六级","考研"],"example":"The committee rejected the proposal.","translation":"委员会否决了提案。","labelSource":"ECDICT"},{"word":"rejection","meaning":"拒绝；驳回","pos":"n.","segments":["re","ject","ion"],"levels":["六级"],"example":"She handled the rejection calmly.","translation":"她平静地面对了拒绝。","labelSource":"ECDICT"},{"word":"inject","meaning":"注射；注入","pos":"v.","segments":["in","ject"],"levels":["六级","考研"],"example":"The nurse injected the medicine.","translation":"护士注射了药物。","labelSource":"ECDICT"},{"word":"injection","meaning":"注射；注入","pos":"n.","segments":["in","ject","ion"],"levels":["四级","六级"],"example":"The patient received an injection.","translation":"患者接受了注射。","labelSource":"ECDICT"},{"word":"eject","meaning":"弹出；驱逐","pos":"v.","segments":["e","ject"],"levels":["六级","考研"],"example":"Press this button to eject the disk.","translation":"按这个按钮弹出磁盘。","labelSource":"ECDICT"}]},{"title":"对象与主题","note":"有些词由“投向前方”转为抽象含义。","entries":[{"word":"object","meaning":"物体；目标；反对","pos":"n./v.","segments":["ob","ject"],"levels":["中考","高考","四级","六级","考研"],"example":"Several people objected to the plan.","translation":"几个人反对这一计划。","labelSou en rupture.","translation":"管道突然破裂。","labelSource":"ECDICT"}]},{"title":"爆发与败坏","note":"从物理破裂延伸到制度被破坏。","entries":[{"word":"erupt","meaning":"爆发；喷发","pos":"v.","segments":["e","rupt"],"levels":["高考","六级","考研"],"example":"The volcano erupted suddenly.","translation":"火山突然喷发。","labelSource":"ECDICT"},{"word":"eruption","meaning":"爆发；喷发","pos":"n.","segments":["e","rupt","ion"],"levels":["六级"],"example":"The eruption covered nearby roads in ash.","translation":"火山喷发使附近道路覆上火山灰。","labelSource":"ECDICT"},{"word":"corrupt","meaning":"腐败的；使败坏","pos":"adj./v.","segments":["cor","rupt"],"levels":["高考","六级","考研"],"example":"The investigation exposed corrupt officials.","translation":"调查揭露了腐败官员。","labelSource":"ECDICT"},{"word":"corruption","meaning":"腐败；堕落","pos":"n.","segments":["cor","rupt","ion"],"levels":[],"example":"The new law aims to reduce corruption.","translation":"新法律旨在减少腐败。","labelSource":"ECDICT"},{"word":"bankrupt","meaning":"破产的","pos":"adj./n.","segments":["bank","rupt"],"levels":["六级","考研"],"example":"The company went bankrupt last year.","translation":"这家公司去年破产了。","labelSource":"ECDICT"}]}]},{"id":"duct","label":"duc / duct","meaning":"引导；带领","source":"来自拉丁语 ducere（带领）及分词词干 duct-。","mnemonic":"pro- 向前带出就是 produce；re- 往回带就是 reduce；con- 一起引导就是 conduct。","forms":["duc","duct","duce"],"groups":[{"title":"生产与变化","note":"把产品想象成从生产线“带出来”。","entries":[{"word":"produce","meaning":"生产；产生；农产品","pos":"v./n.","segments":["pro","duce"],"levels":["中考","高考","四级","六级","考研"],"example":"The factory produces electric cars.","translation":"这家工厂生产电动汽车。","labelSource":"ECDICT"},{"word":"product","meaning":"产品；产物","pos":"n.","segments":["pro","duct"],"levels":["高考","四级","六级","考研"],"example":"This product is easy to use.","translation":"这款产品使用方便。","labelSource":"ECDICT"},{"word":"production","meaning":"生产；制作","pos":"n.","segments":["pro","duct","ion"],"levels":["高考","四级","六级","考研"],"example":"Factory production increased in June.","translation":"工厂产量在六月增长。","labelSource":"ECDICT"},{"word":"productive","meaning":"多产的；富有成效的","pos":"adj.","segments":["pro","duct","ive"],"levels":["四级","六级","考研"],"example":"We had a productive meeting today.","translation":"我们今天开了一个富有成效的会议。","labelSource":"ECDICT"},{"word":"reduce","meaning":"减少；降低","pos":"v.","segments":["re","duce"],"levels":["高考","四级","六级","考研"],"example":"We need to reduce waste.","translation":"我们需要减少浪费。","labelSource":"ECDICT"},{"word":"reduction","meaning":"减少；削减","pos":"n.","segments":["re","duct","ion"],"levels":["四级","六级","考研"],"example":"The policy led to a reduction in waste.","translation":"这项政策减少了浪费。","labelSource":"ECDICT"}]},{"title":"引入与推导","note":"把人、信息或者观点带进来。","entries":[{"word":"introduce","meaning":"介绍；引入","pos":"v.","segments":["intro","duce"],"levels":["中考","高考","四级","六级","考研"],"example":"Let me introduce our new colleague.","translation":"我来介绍我们的新同事。","labelSource":"ECDICT"},{"word":"introduction","meaning":"介绍；引言","pos":"n.","segments":["intro","duct","ion"],"levels":["中考","高考","四级","六级","考研"],"example":"The book has a short introduction.","translation":"这本书有一篇简短的引言。","labelSource":"ECDICT"},{"word":"conduct","meaning":"实施；行为；指挥","pos":"v./n.","segments":["con","duct"],"levels":["高考","四级","六级","考研"],"example":"Researchers conducted an experiment.","translation":"研究人员开展了一项实验。","labelSource":"ECDICT"},{"word":"conductor","meaning":"指挥；导体","pos":"n.","segments":["con","duct","or"],"levels":["高考","四级","六级","考研"],"example":"The conductor raised his hands.","translation":"指挥举起了双手。","labelSource":"ECDICT"},{"word":"deduce","meaning":"推断；演绎","pos":"v.","segments":["de","duce"],"levels":["四级","六级","考研"],"example":"We can deduce the result from these facts.","translation":"我们可以根据这些事实推断结果。","labelSource":"ECDICT"},{"word":"deduction","meaning":"推论；扣除","pos":"n.","segments":["de","duct","ion"],"levels":[],"example":"The detective made a logical deduction.","translation":"侦探作出了合乎逻辑的推断。","labelSource":"ECDICT"}]}]},{"id":"aud","label":"aud","meaning":"听；声音","source":"源自拉丁语 audire（听），与听觉、听众、试听有关。","mnemonic":"aud- 听：audible 听得见；audience 聚在一起听的人。","forms":["aud","audi"],"groups":[{"title":"听觉与听众","note":"从听到声音到倾听的人群。","entries":[{"word":"audio","meaning":"音频；声音的","pos":"n./adj.","segments":["audi","o"],"levels":["四级","考研"],"example":"The course includes audio lessons.","translation":"这门课程包含音频课。","labelSource":"ECDICT"},{"word":"audible","meaning":"听得见的","pos":"adj.","segments":["aud","ible"],"levels":[],"example":"His voice was barely audible.","translation":"他的声音几乎听不见。","labelSource":"ECDICT"},{"word":"inaudible","meaning":"听不见的","pos":"adj.","segments":["in","aud","ible"],"levels":[],"example":"His voice was almost inaudible.","translation":"他的声音几乎听不见。","labelSource":"ECDICT"},{"word":"audience","meaning":"观众；听众","pos":"n.","segments":["aud","ience"],"levels":["高考","四级","六级","考研"],"example":"The audience applauded loudly.","translation":"观众热烈鼓掌。","labelSource":"ECDICT"},{"word":"audition","meaning":"试镜；试听","pos":"n./v.","segments":["aud","it","ion"],"levels":[],"example":"She has an audition for the school play.","translation":"她要参加学校话剧的试镜。","labelSource":"ECDICT"},{"word":"auditory","meaning":"听觉的","pos":"adj.","segments":["aud","it","ory"],"levels":[],"example":"The brain processes auditory signals.","translation":"大脑处理听觉信号。","labelSource":"ECDICT"},{"word":"auditorium","meaning":"礼堂；观众席","pos":"n.","segments":["aud","it","orium"],"levels":["考研"],"example":"The lecture is in the main auditorium.","translation":"讲座在主礼堂举行。","labelSource":"ECDICT"}]}]},{"id":"voc","label":"voc / vok","meaning":"呼唤；说话","source":"源自拉丁语 vocare（呼唤），相关形式有 voc、vok（拼写同源线索而非所有词都直接按现代词素拼合）。","mnemonic":"ad- 向人呼喊主张是 advocate；in- 召唤是 invoke；re- 召回是 revoke。","forms":["voc","vok","voca"],"groups":[{"title":"声音与表达","note":"从说话联想到词汇、嗓音。","entries":[{"word":"vocal","meaning":"嗓音的；直言的","pos":"adj.","segments":["voc","al"],"levels":["六级","考研"],"example":"She is a vocal supporter of the plan.","translation":"她是该计划的公开支持者。","labelSource":"ECDICT"},{"word":"vocabulary","meaning":"词汇；词汇 const KEY='rootlab_standalone_demo_v3';

  state.quizRuns=Number.isFinite(saved.quizRuns)?saved.quizRuns:0;

}}catch(_){/* private browsing, inaccessible localStorage, or malformed backup */}

function partType(s,i,parts,root){if(root.forms.includes(s))return '核心词根';if(i===0&&parts.length>1&&prefixes[s])return '前缀';if(i===parts.length-1&&parts.length>1&&suffixes[s])return '后缀';return '构词部分';}

const WORD_NOTES={"success":{"story":"success 与拉丁语 successus（事情的进展、结果）相关。它最初强调事情接续发生的结果，后来常用来指良好的结果，即“成功”。","memory":"success 是名词，重点记“成功、成就”。把它和 succeed（成功、继任）以及 successful（成功的）放在一起记。"},"successful":{"story":"successful 由 success（成功）和形容词后缀 -ful 构成，表示取得成功或产生良好效果。","memory":"success 是名词；successful 是形容词。The project was successful. 记住“项目取得了成功”。"},"successfully":{"story":"successfully 是在 successful（成功的）基础上加副词后缀 -ly，表示“成功地、顺利地”。","memory":"successful 描述事物，successfully 修饰动作；She successfully completed the task. 表示她顺利完成了任务。"},"succeed":{"story":"succeed 可追溯到拉丁语 succedere，原本含有“随后而来、接替”的意思，后来也形成“实现目标、成功”的常见用法。","memory":"一个词有两组常见含义：succeed in doing sth. 表示“成功做成”；succeed someone 表示“接替某人”。"},"successor":{"story":"successor 属于 succeed（接替、继任）的词族，强调接替上一任职务或身份的人。","memory":"记住 successor 是“接任的人”，可以和 predecessor（前任）配对学习。"},"succession":{"story":"succession 与 succeed、successor 同源，突出“一个接着一个”的连续性，常表示接连发生或继承、继任。","memory":"a succession of events 是“一连串事件”；succession plan 是“继任计划”。"},"successive":{"story":"successive 与 succession 同属连续、接续这一词义分支，形容多个事物前后紧接发生。","memory":"successive days 表示“连续的几天”；不要和 successful（成功的）混淆。"},"process":{"story":"process 与拉丁语 processus（向前推进、行进过程）相关，逐渐用于表示事物的发展过程以及按步骤完成的处理活动。","memory":"process 强调“正在推进的过程”，可以说 learning process（学习过程）或 manufacturing process（生产过程）。"},"proceed":{"story":"proceed 来自拉丁语 procedere（向前走、继续行进），由 pro-（向前）和 cedere（行进）构成；现代英语常表示“继续进行”。","memory":"proceed with the plan 表示“继续执行计划”。抓住 pro- 向前和 ced/ceed 行进的方向感。"},"procedure":{"story":"procedure 经由法语 procédure 进入英语；它与法语 procéder 和拉丁语 procedere（向前推进、进行）有关。可以用 pro-（向前）＋ced（行进）＋-ure（名词词尾）理解其“按步骤进行的方法、程序”这一含义。","memory":"想象按先后顺序完成一项工作：每一步依次向前推进，这套固定步骤就是 procedure（程序、手续）。"},"procession":{"story":"procession 与拉丁语 processio（行进、列队向前）有关，在现代英语中通常指有组织地前进的队伍或行列。","memory":"procession 强调“人在队列中向前行进”，例如 wedding procession（婚礼行列）。"},"access":{"story":"access 与拉丁语 accedere（走近、接近）相关，后来发展出进入、到达、使用某物的权利等意义。","memory":"access to information 是“获取信息的途径”；have access to 表示“能够使用或进入”。"},"accessible":{"story":"accessible 与 access（进入、接近）同族，形容事物“可以到达、可以获得或容易理解”。","memory":"accessible website 是“易于访问的网站”，accessible explanation 是“容易理解的解释”。"},"recede":{"story":"recede 可追溯到拉丁语 recedere，即“向后走、退离”；re- 有向后的方向感，ced/cede 对应行进。","memory":"海水退去、发际线后移、距离逐渐拉远，都可以用 recede 来表达“后退、退去”。"},"recession":{"story":"recession 与拉丁语 recessio（退却、退离）有关，现代英语也用于经济领域，表示经济活动的衰退。","memory":"economic recession 是“经济衰退”；和 recede（后退、退去）放在一起记。"},"concede":{"story":"concede 与拉丁语 concedere（退让、让出、同意）相关，现代英语常表示承认某一点或做出让步。","memory":"concede a point 是“承认某一点”；concede defeat 是“承认失败”。"},"concession":{"story":"concession 与 concede 同属“让出、让步”词族，常指让步、优惠条件，也可以表示特许经营权。","memory":"make a concession 是“作出让步”；concession agreement 可表示“特许协议”。"},"precede":{"story":"precede 源于拉丁语 praecedere（走在前面），由 prae-（在前）和 cedere（行进）组成，现代英语常表示“在……之前发生”。","memory":"A precedes B 表示“A 在 B 之前”；对应的名词是 precedence（优先、在先）。"},"precedent":{"story":"precedent 与 precede 的“在前、先行”概念相关，在普通及法律语境中指可为后续事件提供参照的先例。","memory":"set a precedent 是“开创先例”；legal precedent 是“法律先例”。"},"excess":{"story":"excess 与拉丁语 excedere（走出去、越出界限）有关，后引申为超过正常数量或限度的部分。","memory":"in excess of 表示“超过”；excess capacity 是“过剩产能”。"},"excessive":{"story":"excessive 是 excess（过量、超出）加形容词后缀 -ive 形成的词，表示超过合理限度的。","memory":"excessive spending（过度支出）、excessive pressure（过大压力），都强调超出正常或适当水平。"}};
function wordSpecificNotes(w){
 const name=String(w.word||'').toLowerCase(),fixed=WORD_NOTES[name];
 if(fixed)return {heading:'词源故事',story:fixed.story,memory:fixed.memory};
 const parts=Array.isArray(w.segments)?w.segments:[];
 const elements=parts.map((seg,i)=>{
  const kind=partType(seg,i,parts,w.root);
  const definition=segmentDesc(seg,kind);
  if(kind==='前缀')return '前缀 '+seg+'-（'+definition+'）';
  if(kind==='核心词根')return '词根 '+seg+'（'+definition+'）';
  if(kind==='后缀')return '后缀 -'+seg+'（'+definition+'）';
  return '构词部分 '+seg;
 });
 const meaning=String(w.meaning||'');
 const story=name+'（'+meaning+'）可以按 '+parts.join(' + ')+' 记忆：'+elements.join('，')+'。从组成部分理解这个单词的含义与用法。';
 const sentence=String(w.example||''),translation=String(w.translation||'');
 const memory='记住 '+name+'（'+short(meaning)+'）：'+(sentence?'读一遍 '+sentence+(translation?'（'+translation+'）':'')+'，将词义与句子中的用法联系起来。':'把它归入「'+w.group.title+'」词义组，结合词根和语境反复回忆。');
 return {heading:'当前单词解析',story,memory};
}

function editDistance(a,b){const n=a.length,m=b.length,prev=Array.from({length:m+1},(_,i)=>i);for(let i=1;i<=n;i++){let last=i-1;prev[0]=i;for(let j=1;j<=m;j++){let old=prev[j];prev[j]=Math.min(prev[j]+1,prev[j-1]+1,last+(a[i-1]===b[j-1]?0:1));last=old;}}return prev[m];}
const SORTED_LEX=LEX_ROWS.map(x=>x[0]);
const CN_INDEX=LEX_ROWS.map(x=>translationParts(x).join(' '));
function prefixStart(query){let lo=0,hi=SORTED_LEX.length;while(lo<hi){const m=(lo+hi)>>>1;if(SORTED_LEX[m]<query)lo=m+1;else hi=m;}return lo;}
function directMatches(q){const query=String(q||'').trim().toLowerCase();if(!query)return[];const results=[],seen=new Set();
 const add=(name,score)=>{if(seen.has(name))return;const w=studyItem(name);if(!w)return;seen.add(name);results.push({w,score,rank:LEX_MAP.get(name)?.[4]||99999});};
 if(/^[a-z]+$/.test(query)){
  let i=prefixStart(query),limit=0;while(i<SORTED_LEX.length&&SORTED_LEX[i].startsWith(query)&&limit<600){const name=SORTED_LEX[i++];add(name,name===query?0:WORD_MAP.has(name)?1:2);limit++;}
  for(const w of UNIQUE){if(w.root.label.toLowerCase().includes(query)||w.root.forms.includes(query))add(w.word.toLowerCase(),7);}
  if(!results.length&&query.length>=3)for(const r of LEX_ROWS){if(r[0].includes(query))add(r[0],4);if(results.length>=100)break;}
 }else{
  for(let i=0;i<LEX_ROWS.length;i++)if(CN_INDEX[i].includes(query))add(LEX_ROWS[i][0],6);
  for(const w of UNIQUE)if(w.meaning.includes(query)||w.root.meaning.includes(query))add(w.word.toLowerCase(),5);
 }
 results.sort((a,b)=>a.score-b.score||a.rank-b.rank||a.w.word.localeCompare(b.w.word));return results.slice(0,45);
}
function fuzzyMatches(q){const query=String(q||'').trim().toLowerCase();if(!/^[a-z]{3,25}$/.test(query))return[];
 const max=query.length<6?1:2,first=query[0];let results=[];
 for(const entry of LEX_ROWS){const name=entry[0];if(Math.abs(query.length-name.length)>max||name[0]!==first)continue;
 const dist=editDistance(query,name);if(dist<=max)results.push({w:studyItem(name),score:dist,rank:entry[4]||99999});}
 results.sort((a,b)=>a.score-b.score||a.rank-b.rank);return results.slice(0,5);}
function matchWords(q){const m=directMatches(q);return (m.length?m:fuzzyMatches(q)).slice(0,8).map(x=>x.w);}
function canonicalWord(q){const wd=String(q||'').toLowerCase().trim();const endings=[[/ies$/,'y'],[/ied$/,'y'],[/ing$/,''],[/ing$/,'e'],[/ed$/,''],[/ed$/,'e'],[/es$/,''],[/s$/,''],[/er$/,''],[/est$/,'']];if(WORD_MAP.has(wd))return WORD_MAP.get(wd);
 for(const [rx,to] of endings){const base=wd.replace(rx,to);if(base!==wd&&WORD_MAP.has(base))return WORD_MAP.get(base);}return null;}
